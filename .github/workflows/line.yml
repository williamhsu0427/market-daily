name: LINE 早報
on:
  schedule:
    - cron: '40 23 * * 1-5'   # 台北週二到週六 07:40（GitHub 排程常會晚幾分鐘到二十分鐘）
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py data.json
      - run: python3 line_push.py data.json
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
