name: 更新行情
on:
  schedule:
    - cron: '7 * * * *'      # 每小時一次
    - cron: '20 21 * * *'    # 台北 05:20，美股與夜盤收盤後補一次
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py data.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 只有價格變了才提交（忽略 updated 時間戳）
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"updated"'; then
            git commit -m "更新行情 $(TZ=Asia/Taipei date '+%F %H:%M')" && git push
          fi
